server {

    server_name korvuz.site www.korvuz.site;

    root /opt/korvuz-releases/20261028T122145Z-96e20013a591;
    index index.html;

    error_page 404 /404.html;
    location = /404.html { internal; }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "no-cache" always;

    location = /consult { return 301 /services/$is_args$args; }
    location = /consult/ { return 301 /services/$is_args$args; }
    location = /consult/index.html { return 301 /services/$is_args$args; }

    location ^~ /assets/media/ {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/korvuz.site/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/korvuz.site/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.korvuz.site) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = korvuz.site) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;

    server_name korvuz.site www.korvuz.site;
    return 404; # managed by Certbot




}